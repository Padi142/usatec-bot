[project]
name = "signal-tldr-bot"
version = "0.1.0"
description = "Signal group chat bot that summarizes recent messages with an LLM (/tldr N)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
